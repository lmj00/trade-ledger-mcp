name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java 21 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: -Djdk.httpclient.disableRetryConnect=true -Djdk.httpclient.redirects.retrylimit=1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run tests
        run: ./gradlew --no-daemon --console=plain test
